name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4          # nâng cấp lên v4
        with:
          fetch-depth: 0                   # lấy toàn bộ lịch sử

      - name: Pull latest changes (before generation)
        run: git pull origin main --rebase

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated" || echo "No changes to commit"
          git pull origin main --rebase   # kéo lần nữa phòng khi remote thay đổi trong lúc action chạy
          git push origin main
